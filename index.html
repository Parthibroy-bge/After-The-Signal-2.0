                          <div className="font-mono text-xs text-cyan-300 flex justify-between">
                            <span>{p.title}</span>
                            <span>{phoenixPillars[idx] ? "VERIFIED" : "VERIFY"}</span>
                          </div>
                          <p className="text-xs mt-1.5 leading-relaxed text-slate-300">{p.detail}</p>
                        </button>
                      ))}
                    </div>

                    <div className="pt-3 border-t border-slate-800 space-y-2.5">
                      <div className="text-xs font-semibold text-amber-300">
                        Scientific Method Check: What did Phoenix actually prove?
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => setPhoenixQuizChoice("life")}
                          className={`p-2.5 rounded-lg border text-xs text-left ${
                            phoenixQuizChoice === "life"
                              ? "bg-rose-950/50 border-rose-400 text-rose-200"
                              : "bg-slate-900 border-slate-800 text-slate-300"
                          }`}
                        >
                          A) It directly imaged living Martian bacteria.
                        </button>
                        <button
                          onClick={() => {
                            setPhoenixQuizChoice("habitability");
                            awardProgress(100, "phoenix-ice");
                          }}
                          className={`p-2.5 rounded-lg border text-xs text-left ${
                            phoenixQuizChoice === "habitability"
                              ? "bg-emerald-950/50 border-emerald-400 text-emerald-200"
                              : "bg-slate-900 border-slate-800 text-slate-300"
                          }`}
                        >
                          B) It proved water ice & habitable soil chemistry (not life itself).
                        </button>
                      </div>
                    </div>
                  </section>

                  {/* LAB 3: SILENT HARDWARE TELEMETRY DECODER */}
                  <section className="rounded-2xl border border-slate-700/80 bg-[#0a0f1c] p-6 space-y-5">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="text-xs font-mono text-emerald-400 uppercase tracking-wider">Case File 03 • Deep Space Network</span>
                        <h3 className="font-display text-xl font-bold text-white mt-0.5">
                          Silent Hardware Beacon Decoder
                        </h3>
                      </div>
                      <span className="font-mono text-xs px-2.5 py-1 rounded bg-slate-900 border border-slate-700 text-cyan-300">
                        Decoded: {recoveredCount}/{BEACON_CHALLENGES.length}
                      </span>
                    </div>

                    {(() => {
                      const challenge = BEACON_CHALLENGES[beaconIdx];
                      const isTuned = Math.abs(selectedFrequency - challenge.freq) <= 40;
                      return (
                        <div className="space-y-4">
                          {/* FREQUENCY TUNER */}
                          <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2">
                            <div className="flex justify-between text-xs font-mono">
                              <span className="text-slate-400">DSN CARRIER FREQUENCY TUNER</span>
                              <span className={isTuned ? "text-emerald-400 font-bold" : "text-amber-400"}>
                                {selectedFrequency} MHz {isTuned ? "[SIGNAL LOCKED]" : `(Target: ~${challenge.freq} MHz)`}
                              </span>
                            </div>
                            <input
                              type="range"
                              min="350"
                              max="8500"
                              step="5"
                              value={selectedFrequency}
                              onChange={(e) => setSelectedFrequency(Number(e.target.value))}
                              className="w-full accent-cyan-400 cursor-pointer"
                            />
                            <div className="p-2.5 rounded bg-black/70 border border-slate-800 font-mono text-xs text-emerald-300 min-h-[54px]">
                              {isTuned
                                ? challenge.signalText
                                : "/// STATIC NOISE /// Adjust carrier slider near target MHz to demodulate telemetry packet..."}
                            </div>
                          </div>

                          {/* IDENTIFY SPACECRAFT */}
                          <div className="space-y-2">
                            <div className="text-xs text-slate-300 font-medium">Identify the silent monument transmitting this final log:</div>
                            <div className="space-y-2">
                              {challenge.options.map((opt, idx) => (
                                <button
                                  key={idx}
                                  onClick={() => {
                                    setBeaconGuess(idx);
                                    if (idx === challenge.answer) {
                                      const nextCount = recoveredCount + 1;
                                      setRecoveredCount(nextCount);
                                      awardProgress(120, nextCount >= 2 ? "dsn-decoder" : null);
                                    }
                                  }}
                                  className={`w-full p-2.5 rounded-lg border text-left text-xs transition ${
                                    beaconGuess === idx
                                      ? idx === challenge.answer
                                        ? "bg-emerald-950/60 border-emerald-400 text-emerald-200"
                                        : "bg-rose-950/60 border-rose-400 text-rose-200"
                                      : "bg-slate-900 border-slate-800 hover:border-cyan-500/40 text-slate-200"
                                  }`}
                                >
                                  {opt}
                                </button>
                              ))}
                            </div>
                          </div>

                          {beaconGuess === challenge.answer && (
                            <div className="p-3 rounded-lg bg-cyan-950/40 border border-cyan-500/30 text-xs text-cyan-200 flex items-center justify-between gap-3">
                              <span>{challenge.fact}</span>
                              <button
                                onClick={() => {
                                  setBeaconGuess(null);
                                  const nextIdx = (beaconIdx + 1) % BEACON_CHALLENGES.length;
                                  setBeaconIdx(nextIdx);
                                  setSelectedFrequency(BEACON_CHALLENGES[nextIdx].freq);
                                }}
                                className="shrink-0 px-3 py-1.5 rounded bg-cyan-500 text-slate-950 font-bold"
                              >
                                Next Beacon →
                              </button>
                            </div>
                          )}
                        </div>
                      );
                    })()}
                  </section>
                </div>
              </div>
            )}

            {/* ==================== TAB 2: 10-MISSION MUSEUM EXHIBITION ==================== */}
            {activeTab === "museum" && (
              <div className="space-y-6">
                <div className="flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <h2 className="font-display text-2xl md:text-3xl font-bold text-white">
                      Silent Monuments Across Two Worlds
                    </h2>
                    <p className="text-sm text-slate-400">
                      Explore 10 verified NASA robotic & human surface missions resting on the Moon and Mars.
                    </p>
                  </div>
                  <div className="flex gap-2">
                    {["ALL", "MARS", "MOON"].map(f => (
                      <button
                        key={f}
                        onClick={() => setBodyFilter(f)}
                        className={`px-3.5 py-1.5 rounded-lg font-mono text-xs border ${
                          bodyFilter === f
                            ? "bg-cyan-500 text-slate-950 font-bold border-cyan-400"
                            : "bg-slate-900 text-slate-300 border-slate-800"
                        }`}
                      >
                        {f} ({f === "ALL" ? 10 : MISSIONS.filter(m => m.body.toUpperCase() === f).length})
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid lg:grid-cols-12 gap-6">
                  {/* MISSION SELECTOR RAIL */}
                  <div className="lg:col-span-4 space-y-2 max-h-[720px] overflow-y-auto pr-1">
                    {filteredMissions.map(m => (
                      <button
                        key={m.id}
                        onClick={() => setSelectedMissionId(m.id)}
                        className={`w-full p-3.5 rounded-xl border text-left transition ${
                          selectedMissionId === m.id
                            ? "bg-gradient-to-r from-cyan-950/60 to-slate-900 border-cyan-400 shadow-md"
                            : "bg-slate-900/60 border-slate-800 hover:border-slate-700"
                        }`}
                      >
                        <div className="flex items-center justify-between text-[11px] font-mono">
                          <span className={m.body === "Mars" ? "text-amber-400" : "text-slate-300"}>
                            {m.body.toUpperCase()} • {m.years}
                          </span>
                          <span className="px-2 py-0.5 rounded bg-slate-950 text-cyan-300 border border-slate-800">
                            {m.status}
                          </span>
                        </div>
                        <div className="font-bold text-white mt-1">{m.name}</div>
                        <div className="text-xs text-slate-400 mt-0.5 line-clamp-1">{m.coords}</div>
                      </button>
                    ))}
                  </div>

                  {/* DETAILED MISSION EXHIBITION HALL */}
                  <div className="lg:col-span-8 rounded-2xl border border-slate-800 bg-[#0a0f1c] p-6 space-y-6">
                    <div className="flex flex-wrap items-start justify-between gap-4 border-b border-slate-800 pb-4">
                      <div>
                        <div className="flex items-center gap-2 font-mono text-xs text-amber-400">
                          <span>{currentMission.body.toUpperCase()} SURFACE ARCHIVE</span>
                          <span>•</span>
                          <span>{currentMission.years}</span>
                        </div>
                        <h3 className="font-display text-2xl md:text-3xl font-bold text-white mt-1">
                          {currentMission.name}
                        </h3>
                        <div className="text-xs font-mono text-slate-400 mt-1">
                          Coordinates: {currentMission.coords} • Distance: {currentMission.distanceKm}
                        </div>
                      </div>
                      <a
                        href={currentMission.nasaUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-3.5 py-2 rounded-lg bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-400/40 text-cyan-300 text-xs font-mono"
                      >
                        NASA Official Dossier ↗
                      </a>
                    </div>

                    {/* FIRST-PERSON MACHINE MONOLOGUE */}
                    <blockquote className="p-4 rounded-xl bg-gradient-to-r from-amber-500/10 to-cyan-500/10 border-l-4 border-amber-400 italic text-slate-200 text-sm leading-relaxed">
                      “{currentMission.monologue}”
                    </blockquote>

                    {/* TELEMETRY SPECS */}
                    <div className="grid grid-cols-3 gap-3">
                      <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">ACTIVE SPAN</div>
                        <div className="text-sm font-bold text-white mt-0.5">{currentMission.telemetry.duration}</div>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">POWER / MASS</div>
                        <div className="text-sm font-bold text-white mt-0.5">{currentMission.telemetry.mass}</div>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-900/90 border border-slate-800">
                        <div className="text-[11px] font-mono text-slate-400">POWER SYSTEM</div>
                        <div className="text-sm font-bold text-cyan-300 mt-0.5">{currentMission.power}</div>
                      </div>
                    </div>

                    {/* 5-CHAPTER MISSION STORY */}
                    <div className="space-y-3">
                      <h4 className="font-mono text-xs uppercase tracking-wider text-cyan-400">
                        5-Chapter Mission Chronicle
                      </h4>
                      <div className="space-y-2.5">
                        {currentMission.chapters.map((ch, idx) => (
                          <div key={idx} className="p-3.5 rounded-xl bg-slate-900/60 border border-slate-800/90">
                            <div className="font-semibold text-sm text-amber-300">{ch.title}</div>
                            <p className="text-xs md:text-sm text-slate-300 mt-1 leading-relaxed">{ch.text}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== TAB 3: TELEMETRY COMPARISON MATRIX ==================== */}
            {activeTab === "compare" && (
              <div className="space-y-5">
                <div>
                  <h2 className="font-display text-2xl font-bold text-white">Cross-Mission Telemetry Matrix</h2>
                  <p className="text-sm text-slate-400">Side-by-side comparison of power architecture, landing zones, and scientific legacy across all 10 missions.</p>
                </div>
                <div className="overflow-x-auto rounded-2xl border border-slate-800 bg-[#0a0f1c]">
                  <table className="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                      <tr className="border-b border-slate-800 bg-slate-900/90 font-mono text-cyan-300">
                        <th className="p-3.5">Spacecraft</th>
                        <th className="p-3.5">Body</th>
                        <th className="p-3.5">Active Years</th>
                        <th className="p-3.5">Power Source</th>
                        <th className="p-3.5">Current State</th>
                        <th className="p-3.5">Primary Scientific Breakthrough</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/80">
                      {MISSIONS.map(m => (
                        <tr key={m.id} className="hover:bg-slate-900/50">
                          <td className="p-3.5 font-semibold text-white">{m.name}</td>
                          <td className="p-3.5 font-mono text-amber-300">{m.body}</td>
                          <td className="p-3.5 font-mono text-slate-300">{m.years}</td>
                          <td className="p-3.5 text-slate-300">{m.power}</td>
                          <td className="p-3.5">
                            <span className="px-2 py-0.5 rounded bg-slate-950 border border-slate-700 font-mono text-[11px] text-cyan-300">
                              {m.status}
                            </span>
                          </td>
                          <td className="p-3.5 text-slate-300">{m.telemetry.discoveries}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 py-5 px-4 text-center text-xs text-slate-500 font-mono">
            After the Signal • Data sourced from NASA Planetary Data System (PDS)
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
